<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SeBiG – Selektionsstrukturen auf der Sekundarstufe I</title>
<style>

:root{
  --ink:#0f172a; --ink2:#334155; --mute:#64748b; --faint:#94a3b8;
  --line:#e2e8f0; --line2:#cbd5e1; --bg:#f8fafc; --card:#fff;
  --head:#1e293b; --acc:#38bdf8; --blue:#3b82f6; --blue-d:#1d4ed8; --amber:#f59e0b;
  --stick:112px;
  --serif:-apple-system,BlinkMacSystemFont,"Avenir Next","Avenir","Segoe UI Semibold","Segoe UI",sans-serif;
  --sans:Inter,"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:calc(var(--stick) + 8px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{margin:0;font-weight:600}
small,.small{font-size:12.5px}
.mute{color:var(--mute)}
.wrap{max-width:1560px;margin:0 auto;padding:0 24px}

/* ---------- Kopf ---------- */
.top{background:var(--head);color:#e2e8f0;border-bottom:2px solid var(--acc);position:sticky;top:0;z-index:40}
.top .wrap{display:flex;align-items:flex-end;gap:32px;flex-wrap:wrap;padding-top:14px}
.brand{display:flex;align-items:baseline;gap:14px;padding-bottom:10px}
.brand .mark{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);font-weight:600}
.brand h1{font:600 20px/1.2 var(--serif);color:#f8fafc}
.brand p{margin:2px 0 0;font-size:12.5px;color:var(--faint)}
.tabs{display:flex;gap:2px;margin-left:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--faint);padding:8px 14px 10px;font-weight:500;margin-bottom:-2px}
.tab:hover{color:#f1f5f9}
.tab[aria-selected=true]{color:#fff;border-bottom-color:#fff}

/* ---------- Filterleiste ---------- */
.bar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:var(--top-h,56px);z-index:30}
.bar .wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding-top:9px;padding-bottom:9px}
.fgroup{display:flex;align-items:center;gap:8px}
.flabel{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:3px;overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;padding:5px 12px;color:var(--ink2);border-right:1px solid var(--line2)}
.seg button:last-child{border-right:0}
.seg button:hover{background:#f1f5f9}
.seg button[aria-pressed=true]{background:var(--head);color:#fff}
.sel{max-width:260px;text-overflow:ellipsis}
.sel,.inp{border:1px solid var(--line2);border-radius:3px;background:#fff;padding:5px 8px;max-width:100%}
.sel:focus,.inp:focus,button:focus-visible,summary:focus-visible,path.kt:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.inp{width:200px}
.count{margin-left:auto;white-space:nowrap;color:var(--mute);font-size:12.5px;font-variant-numeric:tabular-nums}
details.dd{position:relative}
details.dd summary{list-style:none;border:1px solid var(--line2);border-radius:3px;padding:5px 10px;cursor:pointer;background:#fff}
details.dd summary::-webkit-details-marker{display:none}
details.dd summary::after{content:"▾";margin-left:8px;color:var(--mute)}
.ddmenu{position:absolute;top:calc(100% + 4px);left:0;background:#fff;border:1px solid var(--line2);border-radius:3px;padding:6px 4px;min-width:280px;z-index:50;box-shadow:0 6px 18px rgba(15,23,42,.10)}
.ddmenu label{display:flex;gap:8px;align-items:center;padding:4px 8px;cursor:pointer}
.ddmenu label:hover{background:#f1f5f9}
.ddmenu .n{margin-left:auto;color:var(--mute);font-variant-numeric:tabular-nums}

/* ---------- Grundbausteine ---------- */
main{padding:20px 0 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px}
.card>.hd{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.card>.hd h2,.card>.hd h3{font:600 16px/1.3 var(--serif)}
.card>.bd{padding:14px 16px}
.hint{color:var(--mute);font-size:12.5px}
.tag{display:inline-block;font-size:11.5px;line-height:1.5;padding:0 6px;border-radius:2px;border:1px solid var(--line2);color:var(--ink2);background:#f1f5f9;white-space:nowrap}
.tag.S{background:var(--head);border-color:var(--head);color:#fff}
.tag.W{background:#fff;border:1px solid var(--ink2);color:var(--ink2)}
.btn{border:1px solid var(--line2);background:#fff;border-radius:3px;padding:4px 10px;color:var(--ink2)}
.btn:hover{background:#f1f5f9}
.btn.link{border:0;background:none;color:var(--blue-d);padding:0;text-decoration:underline;text-underline-offset:2px}
.btn.link:hover{background:none;color:var(--ink)}
sup.fn{color:var(--mute);font-size:10.5px;margin-left:2px}
mark{background:#fde68a;color:inherit;padding:0 1px}

/* ---------- Karte ---------- */
svg.map{width:100%;height:auto;display:block}
svg.map path.kt{stroke:#fff;stroke-width:1.1;fill:var(--faint);cursor:pointer;transition:fill .12s}
svg.map path.kt:hover{filter:brightness(.88)}
svg.map path.kt.dim{cursor:default}
svg.map path.kt.sel{stroke:var(--ink);stroke-width:2}
svg.map .lakes path{fill:#e0f2fe;stroke:#fff;stroke-width:.6;pointer-events:none}
svg.map text{font:600 17px var(--sans);text-anchor:middle;dominant-baseline:central;pointer-events:none;user-select:none}
svg.map .ext line{stroke:var(--mute);stroke-width:.8}
svg.map .ext rect{fill:#fff;stroke:var(--line2);stroke-width:.8}
svg.map .ext text{fill:var(--ink2);font-size:16px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:6px;vertical-align:-1px;border:1px solid rgba(15,23,42,.18)}
.legend .grad{display:inline-block;width:120px;height:10px;vertical-align:middle;margin:0 6px;border:1px solid rgba(15,23,42,.18)}
#tip{position:fixed;z-index:100;pointer-events:none;background:var(--ink);color:#f8fafc;padding:5px 9px;border-radius:3px;font-size:12.5px;opacity:0;max-width:300px;transition:opacity .08s}

/* ---------- Kantone ---------- */
.split{display:grid;grid-template-columns:minmax(380px,580px) minmax(0,1fr);gap:20px;align-items:start}
.split>aside{position:sticky;top:calc(var(--stick) + 12px)}
.ktlist{display:flex;flex-wrap:wrap;gap:4px;margin-top:12px}
.ktlist button{min-width:34px;border:1px solid var(--line2);background:#fff;border-radius:3px;padding:2px 6px;font-size:12.5px;font-variant-numeric:tabular-nums}
.ktlist button:hover{background:#f1f5f9}
.ktlist button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.ktlist button.nodata{color:var(--faint)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;min-height:4px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#eff6ff;border:1px solid #bfdbfe;color:#1e3a8a;border-radius:3px;padding:2px 4px 2px 8px;font-size:12.5px}
.chip button{border:0;background:none;padding:0 4px;color:#1e3a8a;font-size:15px;line-height:1}
.cmp{--n:1}
.cmp .rowh,.cmp .row{display:grid;grid-template-columns:210px repeat(var(--n),minmax(0,1fr))}
.cmp .rowh{position:sticky;top:var(--stick);z-index:5;background:var(--head);color:#f8fafc;border-radius:4px 4px 0 0}
.cmp .rowh>div{padding:9px 14px}
.cmp .rowh b{font:600 15px var(--serif)}
.cmp .rowh button{float:right;background:none;border:0;color:var(--faint);font-size:16px;line-height:1}
.cmp .catrow{grid-column:1/-1;background:#f1f5f9;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 14px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;color:var(--ink2)}
.cmp .catrow span{font-weight:400;letter-spacing:0;text-transform:none;color:var(--mute);margin-left:10px}
.cmp .row>div{padding:10px 14px;border-bottom:1px solid var(--line);min-width:0}
.cmp .row>.c0{background:#fcfdfe;font-weight:500}
.cmp .row>.c0 small{display:block;color:var(--mute);font-weight:400}
.cmp .row>div+div{border-left:1px solid var(--line)}
.cmp-body{background:#fff;border:1px solid var(--line);border-top:0;border-radius:0 0 4px 4px;overflow:hidden}
.entry+.entry{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line2)}
.entry .val{font:600 22px/1.1 var(--serif);font-variant-numeric:tabular-nums}
.entry .val small{font:400 12.5px var(--sans);color:var(--mute);margin-left:3px}
.entry .txt{margin-top:2px;overflow-wrap:anywhere}
.entry .txt.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.entry .more{border:0;background:none;color:var(--blue-d);padding:0;font-size:12.5px;text-decoration:underline;text-underline-offset:2px}
.entry .src{margin-top:5px;font-size:12px;color:var(--mute);overflow-wrap:anywhere}
.entry .src .tag{margin-right:6px}
.none{color:var(--faint);font-style:italic}
.cov{width:100%;border-collapse:collapse}
.cov th,.cov td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.cov th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:600}
.cov td.n,.cov th.n{text-align:right;font-variant-numeric:tabular-nums}

/* ---------- Bausteine ---------- */
.bsplit{display:grid;grid-template-columns:310px minmax(0,1fr);gap:20px;align-items:start}
.bnav{position:sticky;top:calc(var(--stick) + 12px);max-height:calc(100vh - var(--stick) - 28px);overflow:auto;padding:6px 0}
.bnav .glabel{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:600;padding:12px 16px 4px}
.bnav .bi{display:flex;width:100%;text-align:left;border:0;background:none;padding:7px 16px;gap:8px;border-left:3px solid transparent;color:var(--ink2)}
.bnav .bi:hover{background:#f1f5f9}
.bnav .bi.on{border-left-color:var(--blue);background:#eff6ff;color:var(--ink);font-weight:600}
.bnav .bi .n,.bnav .ai .n{margin-left:auto;color:var(--mute);font-weight:400;font-variant-numeric:tabular-nums}
.bnav .sub{padding:2px 0 8px;background:#fbfdff;border-bottom:1px solid var(--line);margin-bottom:2px}
.bnav .sl{font-size:11.5px;color:var(--mute);padding:6px 16px 1px 28px;font-style:italic}
.bnav .ai{display:flex;width:100%;text-align:left;border:0;background:none;padding:4px 16px 4px 28px;gap:8px;color:var(--ink2);font-size:13px}
.bnav .ai:hover{background:#f1f5f9}
.bnav .ai.on{color:var(--blue-d);font-weight:600}
.bnav .ai.on::before{content:"";}
.btop{display:grid;grid-template-columns:minmax(340px,480px) minmax(0,1fr);gap:20px;align-items:start}
.grp{margin-bottom:10px}
.grp h4{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:600;margin-bottom:4px}
.kc{display:inline-block;min-width:32px;text-align:center;padding:0 5px;margin:0 4px 4px 0;border-radius:2px;border:1px solid var(--line2);font-size:12.5px;background:#fff;color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.kc:hover{border-color:var(--ink2)}
.kc.yes{background:#1e3a8a;border-color:#1e3a8a;color:#fff}
.kc.r-einziges{background:#1e3a8a;border-color:#1e3a8a;color:#fff}
.kc.r-vorherrschend{background:#2563eb;border-color:#2563eb;color:#fff}
.kc.r-ebenbürdig{background:#60a5fa;border-color:#60a5fa;color:#0f172a}
.kc.r-untergeordnet{background:#dbeafe;border-color:#93c5fd;color:#1e3a8a}
.kc.no{background:#fff;color:var(--mute);text-decoration:line-through;border-style:dashed}
.kc.na{background:#f1f5f9;color:var(--mute);border-style:dotted}
.ovr{width:100%;border-collapse:collapse}
.ovr td{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:top}
.ovr td:first-child{width:46%;padding-right:12px}
.ovr .an{background:none;border:0;padding:0;text-align:left;color:var(--ink);font-weight:500}
.ovr .an:hover{color:var(--blue-d);text-decoration:underline}
.rank{display:grid;grid-template-columns:34px minmax(0,1fr) 64px;gap:4px 8px;align-items:center;font-variant-numeric:tabular-nums}
.rank button{border:0;background:none;padding:0;text-align:left;font-weight:500}
.rank button:hover{color:var(--blue-d)}
.rank .bar2{height:10px;background:#eff6ff;position:relative}
.rank .bar2 i{position:absolute;left:0;top:0;bottom:0;background:#3b82f6}
.rank .v{text-align:right}
.mtabs{display:flex;gap:0;margin-bottom:10px}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:600;text-align:left;padding:8px 12px;border-bottom:1px solid var(--line2);background:#f8fafc}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.k{white-space:nowrap;width:130px}
.tbl td.k button{border:0;background:none;padding:0;font-weight:600;color:var(--blue-d);text-align:left}
.tbl td.k button:hover{text-decoration:underline}
.tbl td.k small{display:block;color:var(--mute);font-weight:400}

/* ---------- Vergleich ---------- */
.mx-wrap{overflow:auto;max-height:calc(100vh - var(--stick) - 20px);border:1px solid var(--line);border-radius:4px;background:#fff}
table.mx{border-collapse:separate;border-spacing:0;font-size:13px}
table.mx th,table.mx td{border-bottom:1px solid var(--line);padding:0;text-align:center}
table.mx thead th{position:sticky;background:#fff;z-index:2}
table.mx thead tr:first-child th{top:0;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2);padding:6px 6px;border-left:1px solid var(--line2);font-weight:600;vertical-align:bottom;background:#f1f5f9}
table.mx thead tr:nth-child(2) th{top:var(--r1,30px);height:155px;vertical-align:bottom;padding:4px 0;border-bottom:1px solid var(--line2)}
table.mx thead th.corner{left:0;z-index:4;text-align:left;padding-left:14px;min-width:190px;background:#f1f5f9}
table.mx th.vh{width:36px;min-width:36px}
table.mx th.w,table.mx td.w{background:#f1f5f9}
table.mx tr:hover td.w{background:#e8eef5}
table.mx th.vh button{writing-mode:vertical-rl;transform:rotate(180deg);border:0;background:none;text-align:left;font-size:11.5px;color:var(--ink2);padding:2px 2px;max-height:148px;white-space:normal;line-height:1.15;word-break:break-word}

/* ---------- Startseite Kacheln ---------- */
.home-hero{text-align:center;padding:28px 16px 20px;max-width:820px;margin:0 auto}
.home-hero h2{font:600 28px/1.2 var(--serif);color:var(--head);margin-bottom:8px}
.home-hero p{font-size:15px;color:var(--mute);line-height:1.5}
.home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-top:16px}
.home-card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:20px;cursor:pointer;transition:all .18s;display:flex;flex-direction:column;text-align:left}
.home-card:hover{transform:translateY(-3px);border-color:var(--blue);box-shadow:0 8px 24px rgba(15,23,42,.08)}
.home-card .card-head{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.home-card .ic{display:flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:8px;background:#eff6ff;border:1px solid #bfdbfe;flex-shrink:0}
.home-card h3{font:600 20px var(--serif);color:var(--head);margin:0}
.home-card .claim{font-size:13px;font-weight:600;color:var(--blue-d);margin-top:2px}
.home-card p{color:var(--ink2);font-size:13.5px;line-height:1.55;flex-grow:1;margin:0 0 18px}
.home-card .btn-go{align-self:flex-start;background:none;border:0;padding:0;color:var(--blue-d);font-weight:600;font-size:13px}
table.mx th.vh button:hover{color:var(--blue-d)}
table.mx th.vh.sorted button{color:var(--blue-d);font-weight:600}
table.mx td.kn{position:sticky;left:0;background:#fff;z-index:1;text-align:left;padding:5px 14px;white-space:nowrap}
table.mx td.kn button{border:0;background:none;padding:0;text-align:left;color:var(--ink)}
table.mx td.kn button:hover{color:var(--blue-d);text-decoration:underline}
table.mx td.kn b{display:inline-block;width:28px;color:var(--mute);font-weight:600}
table.mx tr:hover td{background:#f1f5f9}
table.mx td.c{height:30px;cursor:default}
table.mx td.c.first,table.mx th.first{border-left:1px solid var(--line2)}
.dot{display:inline-block;width:13px;height:13px;border-radius:50%;vertical-align:middle;cursor:pointer}
.dot.yes{background:#1e3a8a}
.dot.r-einziges{background:#1e3a8a}.dot.r-vorherrschend{background:#2563eb}.dot.r-ebenbürdig{background:#60a5fa}.dot.r-untergeordnet{background:#bfdbfe;border:1px solid #60a5fa}
.dot.no{border:1.5px solid var(--faint);background:#fff}
.dot.na{width:9px;height:2px;border-radius:0;background:var(--faint)}
.dot.none{width:3px;height:3px;background:var(--line2);cursor:default}
.leg-dot{display:inline-flex;align-items:center;gap:6px;margin-right:16px;font-size:12.5px;color:var(--ink2)}
.nbar{position:relative;display:block;height:16px;background:#f1f5f9}
.nbar i{position:absolute;left:0;top:0;bottom:0;background:#bfdbfe}
.nbar span{position:relative;padding:0 6px;font-variant-numeric:tabular-nums;line-height:16px}
table.kz{border-collapse:collapse;min-width:100%}
table.kz th{position:sticky;top:0;background:#f1f5f9;padding:8px 10px;font-size:12px;text-align:right;vertical-align:bottom;border-bottom:1px solid var(--line2);font-weight:600;z-index:2}
table.kz th:first-child,table.kz td:first-child{text-align:left}
table.kz th button{border:0;background:none;font-weight:600;font-size:12px;text-align:right;color:var(--ink2)}
table.kz th.sorted button{color:var(--blue-d)}
table.kz td{padding:4px 10px;border-bottom:1px solid var(--line);text-align:right;min-width:150px}
table.kz td:first-child{min-width:190px}
table.kz tr.stat td{background:#fafcfe;color:var(--ink2);font-variant-numeric:tabular-nums;font-size:12.5px}
table.kz td button{border:0;background:none;padding:0;color:var(--ink)}
table.kz td button:hover{color:var(--blue-d);text-decoration:underline}

/* ---------- Reverse-Suche ---------- */
.rsplit{display:grid;grid-template-columns:minmax(380px,500px) minmax(0,1fr);gap:20px;align-items:start}
.crit{padding:10px 0;border-bottom:1px solid var(--line)}
.crit .l1{display:flex;gap:8px;align-items:center}
.crit .cn{width:20px;height:20px;border-radius:50%;background:var(--head);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none}
.crit .l2,.crit .l3{margin-top:6px;margin-left:28px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.crit .l2 .sel{width:100%}
.crit .x{margin-left:auto;border:0;background:none;font-size:18px;color:var(--mute);line-height:1}
.crit .x:hover{color:#b91c1c}
.crit .warn{margin-left:28px;color:#b45309;font-size:12.5px;margin-top:4px}
.conn{text-align:center;font-size:11.5px;letter-spacing:.1em;color:var(--mute);font-weight:600;padding:2px 0 0}
.ex a{display:block;color:var(--blue-d);text-decoration:underline;text-underline-offset:2px;cursor:pointer;padding:2px 0}
table.rs th,table.rs td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.rs th{font-size:12px;color:var(--ink2);font-weight:600;background:#f8fafc}
table.rs td.ok b{color:#047857}
table.rs td.ko{color:var(--mute)}
table.rs tr.miss td{color:var(--mute)}
table.rs .kb{border:0;background:none;padding:0;font-weight:600;color:var(--blue-d)}
table.rs .kb:hover{text-decoration:underline}

footer{border-top:1px solid var(--line);color:var(--mute);font-size:12.5px;padding:18px 0 40px}
footer p{margin:0 0 4px;max-width:980px}
.view{display:none}.view.on{display:block}
.empty{padding:36px 16px;text-align:center;color:var(--mute)}
@media (max-width:1180px){
  .split,.bsplit,.btop,.rsplit{grid-template-columns:minmax(0,1fr)}
  .split>aside,.bnav{position:static;max-height:none}
}


/* ---- Ergänzungen v2 ---- */
.entry .txt{white-space:pre-line}
.entry .kzl{font-size:12.5px;color:var(--mute);margin-bottom:2px}
.entry .src a{color:var(--blue-d);text-underline-offset:2px}
.entry .tags{margin-top:4px;display:flex;gap:6px;flex-wrap:wrap}
.tag.no{background:#fff;border-color:var(--faint);color:var(--ink2);border-style:dashed}
.tag.na{background:#f1f5f9;color:var(--mute)}
.tag.g{background:#eff6ff;border-color:#bfdbfe;color:#1e3a8a}

.dsl{margin-left:6px}

.cmpwrap{min-width:0}
.rank .gl{grid-column:1/-1}
@media (max-width:900px){
  .wrap{padding:0 14px}
  .top .wrap{gap:6px}
  .tabs{margin-left:0;width:100%;overflow-x:auto}
  .tab{padding:8px 10px 10px;white-space:nowrap}
  .seg{flex-wrap:wrap}
  .seg button{border-bottom:1px solid var(--line2)}
  .inp{width:100%}
  .count{margin-left:0;width:100%}
  .cmpwrap{overflow-x:auto}

  const cr = st.rev.crit, host = $('#crits');
  host.innerHTML = cr.length ? cr.map((c,i) => {
    const ms = c.ausp && AUSP[c.ausp] && VIS.has(c.ausp) ? ausMetrics(c.ausp) : [];
    const kz = c.metric && ms.includes(c.metric) ? c.metric : ms[0];
    return (i ? `<div class="conn">${st.rev.logic === 'AND' ? 'UND' : 'ODER'}</div>` : '') + `<div class="crit" data-i="${i}">
      <div class="l1"><span class="cn">${i+1}</span><select class="sel neg" aria-label="hat / hat nicht"><option value="0" ${!c.neg?'selected':''}>hat</option><option value="1" ${c.neg?'selected':''}>hat nicht</option></select><button class="x" aria-label="Kriterium entfernen">×</button></div>
      <div class="l2"><select class="sel ausp" aria-label="Ausprägung">${ausOptions(c.ausp)}</select></div>
      ${ms.length ? `<div class="l3">${ms.length > 1 ? `<select class="sel met" aria-label="Kennzahl">${ms.map(x => `<option value="${esc(x)}" ${x===kz?'selected':''}>${esc(kzLabel(x))}</option>`).join('')}</select>` : `<span class="mute">${esc(kzLabel(kz))}:</span>`}
        <select class="sel op" aria-label="Vergleich"><option value="any" ${c.op==='any'?'selected':''}>mit beliebigem Wert</option><option value=">=" ${c.op==='>='?'selected':''}>≥</option><option value="<=" ${c.op==='<='?'selected':''}>≤</option></select>
        <input class="inp val" type="number" step="any" value="${esc(c.val)}" style="width:90px" aria-label="Schwellenwert" ${c.op==='any'?'disabled':''}><span class="mute">${esc(unitOfKz(c.ausp, kz).trim())}</span></div>` : ''}
      ${c.ausp && !VIS.has(c.ausp) ? '<div class="warn">Diese Ausprägung gehört nicht zum gewählten Datensatz und wird als «kein Eintrag» gewertet.</div>' : ''}</div>`;
  }).join('') : '<div class="empty" style="padding:20px 0">Noch kein Kriterium. «+ Kriterium» hinzufügen oder ein Beispiel wählen.</div>';
  $$('.crit', host).forEach(el => {
    const c = cr[+el.dataset.i];
    el.querySelector('.neg').onchange = e => { c.neg = +e.target.value; renderRevResult(); commit(); };
    el.querySelector('.ausp').onchange = e => { c.ausp = e.target.value; c.op = 'any'; c.val = ''; c.metric = ''; renderCritList(); renderRevResult(); commit(); };
    el.querySelector('.x').onclick = () => { cr.splice(+el.dataset.i, 1); renderCritList(); renderRevResult(); commit(); };
    const op = el.querySelector('.op'); if (op) op.onchange = e => { c.op = e.target.value; renderCritList(); renderRevResult(); commit(); };
    const v = el.querySelector('.val'); if (v) v.oninput = e => { c.val = e.target.value; renderRevResult(); commit(); };
    const me = el.querySelector('.met'); if (me) me.onchange = e => { c.metric = e.target.value; renderCritList(); renderRevResult(); commit(); };
  });
}
function renderRevResult(){
  const cr = st.rev.crit, and = st.rev.logic === 'AND';
  const res = KT.map(k => { const ev = cr.map(c => evalCrit(k,c)); return {k, ev, hit: cr.length ? (and ? ev.every(x => x.ok) : ev.some(x => x.ok)) : null}; });
  const hits = res.filter(r => r.hit);
  mapR.paint(k => { const r = res.find(x => x.k === k); if (!cr.length) return {fill: BYK[k]?.length ? '#94a3b8' : '#e2e8f0'}; return r.hit ? {fill:'#f59e0b'} : {fill:'#e2e8f0', dim:true}; });
  $('#rleg').innerHTML = cr.length ? LEG.match + legendItem('#e2e8f0','nicht erfüllt') : LEG.data;
  $('#rcount').textContent = cr.length ? `${hits.length} von ${KT.length} Kantonen` : '';
  if (!cr.length){ $('#rres').innerHTML = '<div class="empty">Kriterien hinzufügen, um Kantone zu finden.</div>'; return; }
  const list = res.filter(r => !st.rev.onlyHits || r.hit);
  const head = `<tr><th>Kanton</th>${cr.map((c,i) => `<th><span class="mute">${i+1}.</span> ${esc(critLabel(c))}</th>`).join('')}</tr>`;
  const rows = list.sort((a,b) => (b.hit - a.hit)).map(r => `<tr class="${r.hit ? '' : 'miss'}"><td><button class="kb" data-goto="${r.k}">${esc(NAMES[r.k])}</button> <span class="mute">${r.k}</span></td>${r.ev.map(x => `<td class="${x.ok ? 'ok' : 'ko'}">${x.ok ? '<b>✓</b>' : '✗'} <span class="small">${esc(x.ev)}</span></td>`).join('')}</tr>`).join('');
  $('#rres').innerHTML = `<div style="padding:10px 16px;font-weight:600">${hits.length} Kanton${hits.length === 1 ? '' : 'e'} erfüllen ${and ? 'alle' : 'mindestens eines der'} ${cr.length} Kriterien</div>
    <div style="overflow:auto"><table class="rs" style="width:100%;border-collapse:collapse"><thead>${head}</thead><tbody>${rows || '<tr><td colspan="9" class="none">Kein Kanton erfüllt die Abfrage.</td></tr>'}</tbody></table></div>`;
  $$('#rres .kb').forEach(b => b.onclick = () => goKanton(b.dataset.goto));
}

/* ================================================================
   Routing (Hash-Permalinks)
   #/kanton/BE,ZH?cat=strukturmodell   #/baustein/strukturmodell/geteiltes-modell
   #/vergleich[/kennzahlen]            #/suche?l=OR&c=…
================================================================ */
const enc = encodeURIComponent;
const critEnc = c => [c.neg, enc(c.ausp), c.op, enc(c.val), enc(c.metric)].join('!');
function critDec(s){ const p = s.split('!'); return normCrit({neg:+p[0] ? 1 : 0, ausp:decodeURIComponent(p[1]||''), op:['>=','<='].includes(p[2]) ? p[2] : 'any', val:decodeURIComponent(p[3]||''), metric:decodeURIComponent(p[4]||'')}); }
function qs(o){ const p = []; for (const [k,v] of Object.entries(o)) if (v !== '' && v != null && v !== false) p.push(k + '=' + enc(v)); return p.length ? '?' + p.join('&') : ''; }
function common(){ return {ds: st.ds !== 'S' ? st.ds : '', sub: st.ds === 'W' ? st.sub : '', q: st.q.trim(), off: [...st.off].join('~')}; }
function routeString(){
  const c = common();
  if (st.view === 'kanton') return '/kanton' + (st.sel.length ? '/' + st.sel.join(',') : '') + qs({...c, cat: st.cat && CATBY[st.cat] ? CATBY[st.cat].slug : ''});
  if (st.view === 'baustein'){ const cat = CATBY[st.b.cat], a = st.b.ausp ? AUSP[st.b.ausp] : null;
    return '/baustein/' + (cat ? cat.slug : '') + (a ? '/' + a.slug : '') + qs({...c, m: a ? st.b.kz : '', g: a && st.b.g !== GK ? st.b.g : ''}); }
  if (st.view === 'vergleich') return '/vergleich' + (st.vg.mode === 'kz' ? '/kennzahlen' : '') + qs(c);
  return '/suche' + qs({...c, l: st.rev.logic === 'AND' ? '' : st.rev.logic, c: st.rev.crit.map(critEnc).join('~'), hits: st.rev.onlyHits ? '' : '0'});
}
let mutedHash = false;
function commit(push=false){
  const h = '#' + routeString();
  if (h === location.hash) return;
  try { (push ? history.pushState : history.replaceState).call(history, null, '', h); }
  catch(_) { mutedHash = true; location.hash = h; }
}
function applyRoute(hash){
  const raw = (hash || '').replace(/^#/, '');
  const qi = raw.indexOf('?'), path = qi < 0 ? raw : raw.slice(0, qi), P = new URLSearchParams(qi < 0 ? '' : raw.slice(qi+1));
  const seg = path.split('/').filter(Boolean).map(s => { try { return decodeURIComponent(s); } catch(_) { return s; } });
  st.ds = ['S','W','A'].includes(P.get('ds')) ? P.get('ds') : 'S';
  st.sub = st.ds === 'W' ? (P.get('sub') || '') : '';
  st.q = P.get('q') || ''; st.off = new Set((P.get('off') || '').split('~').filter(Boolean));
  { const sl = seg[0]==='baustein' ? seg[1] : P.get('cat'); const c0 = CATSLUG[sl||'']; if (!P.get('ds') && c0 && c0.ds==='W') st.ds = 'W'; }
  const v = seg[0];
  st.view = ['home','kanton','baustein','vergleich','suche'].includes(v) ? v : 'home';
  if (st.view === 'kanton'){
    st.sel = (seg[1] || '').split(',').map(s => s.toUpperCase()).filter(k => NAMES[k]);
    const cs = CATSLUG[P.get('cat') || '']; st.cat = cs ? cs.id : '';
  } else if (st.view === 'baustein'){
    const cs = CATSLUG[seg[1] || ''];
    st.b.cat = cs ? cs.id : ''; st.b.ausp = ''; st.b.kz = P.get('m') || ''; st.b.g = P.get('g') || GK;
    if (cs && seg[2]){ const a = cs.ausp.find(x => x.slug === seg[2]); if (a) st.b.ausp = a.id; }
  } else if (st.view === 'vergleich'){
    st.vg.mode = seg[1] === 'kennzahlen' ? 'kz' : 'matrix';
  } else {
    st.rev.logic = P.get('l') === 'OR' ? 'OR' : 'AND'; st.rev.onlyHits = P.get('hits') !== '0';
    if (P.has('c')) st.rev.crit = P.get('c').split('~').filter(Boolean).map(critDec);
    else if (!st.rev.crit.length) st.rev.crit = EXAMPLES[0].crit.map(normCrit);
  }
}

const SRC_ORDER = ['IDES-Kantonsumfrage','IDES-Dossier','BFS','Bildungsbericht','INSEMA','Rechtsgrundlage','Kantonale Quelle','Ohne Quellenangabe'];
function syncBar(){
  $$('#setSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.set === st.ds));

    const subs = []; CATS.forEach(c => c.ausp.forEach(a => { if (a.ds === 'W' && a.sub && !subs.includes(a.sub)) subs.push(a.sub); }));
    $('#subSel').innerHTML = `<option value="">Alle Unterkategorien</option>` + subs.map(s => `<option value="${esc(s)}" ${st.sub===s?'selected':''}>${esc(s)}</option>`).join('');
  }
  const cnt = {}; ALL.filter(r => st.ds === 'A' || r.ds === st.ds).forEach(r => cnt[r.qt] = (cnt[r.qt] || 0) + 1);

  const off = SRCS.filter(s => st.off.has(s)).length;
  $('#srcSum').textContent = off ? `${SRCS.length - off} von ${SRCS.length} Quellen` : 'Alle Quellen';
  $('#count').textContent = `${RC.length} Einträge · ${new Set(RC.map(r => r.k)).size} Kantone`;
  $$('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.view === st.view));
  if (document.activeElement !== $('#q')) $('#q').value = st.q;
}

const RENDER = {home:renderHome, kanton:renderKanton, baustein:renderBaustein, vergleich:renderVergleich, suche:renderSuche};

  hideTip(); RENDER[st.view]();
  layout();
}
function setView(v, push=true){ st.view = v; syncBar(); showView(); commit(push); }
function update(){ index(); syncBar(); paintFootnotes(); showView(); commit(); layout(); }
function fullRender(){ index(); syncBar(); paintFootnotes(); showView(); layout(); }

  const th = $('#top').offsetHeight, bh = $('#bar').offsetHeight;

$$('.tab').forEach(t => t.onclick = () => setView(t.dataset.view));

/* ================================================================
   Start: daten.csv laden, sonst eingebettete Kopie
================================================================ */
async function loadData(){
  try {
    const res = await fetch(DATA_URL, {cache:'no-cache'});
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const rows = parseCSV(text);
    return {recs: toRecords(rows), src: 'daten.csv (geladen)'};
  } catch (err) {
    throw new Error('Die Datei daten.csv konnte nicht geladen werden: ' + err.message);
  }
}
(async function boot(){
  try {
    const {recs, src} = await loadData();
    ALL = recs; buildTax(ALL); buildMetrics(); paintMeta();
    $('#dsrc').textContent = `Datenquelle: ${src} · ${ALL.length} Einträge`;
    applyRoute(location.hash);
    $('#loading').remove();
    index(); syncBar(); paintFootnotes(); layout();
    showView(); layout();
    commit();
  } catch (err) {
    console.error(err);
    $('#loading').textContent = 'Die Daten konnten nicht geladen werden: ' + err.message;
  }
})();
